[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
inquire = "0.7"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "6.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
